services:
  postgres:
    image: postgres:16-alpine
    container_name: dabom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dabom
      POSTGRES_USER: dabom
      POSTGRES_PASSWORD: dabom_local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dabom -d dabom"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
